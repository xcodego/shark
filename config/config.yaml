# # ============================================================
# # Shark 项目全局配置文件
# # ============================================================
# # 本文件定义了所有基础设施组件的连接参数和端口配置。
# # 各子包（sharkdb、sharkredis、sharkkafka 等）通过对应的
# # Config 结构体（支持 json/yaml/mapstructure 标签）加载这些配置。
# #
# # 注意事项：
# #   1. 所有密码需替换为实际环境的密码
# #   2. 各 host 地址需根据实际部署拓扑修改
# #   3. 端口号需避免与服务器现有服务冲突
# # ============================================================

# # -----------------------------------------------------------
# # HTTP 服务端口
# # 提供 REST API 对外接口，业务方通过此端口访问服务
# # -----------------------------------------------------------
# http: 3928

# # -----------------------------------------------------------
# # gRPC 服务端口
# # 提供 gRPC 内部服务间调用接口（服务发现基于 Redis）
# # -----------------------------------------------------------
# grpc: 3929

# # -----------------------------------------------------------
# # 健康检查端口
# # 供 Kubernetes / 负载均衡等基础设施进行健康探测
# # 通常返回 200 OK 表示服务正常
# # -----------------------------------------------------------
# health: 3930

# # -----------------------------------------------------------
# # pprof 性能分析端口
# # 提供 Go pprof 性能分析 HTTP 端点（CPU Profile、内存 Profile 等）
# # 建议仅在内网开放，生产环境按需启用
# # -----------------------------------------------------------
# pprof: 3931

# # -----------------------------------------------------------
# # 定时器开关
# # true  = 启用 sharktimer 后台定时任务轮询（基于 Redis ZSet）
# # false = 禁用定时器功能
# # -----------------------------------------------------------
# timer: true

# # ===========================================================
# # Kafka 消息队列配置
# # 用于异步消息通信、事件溯源、日志推送
# # 认证方式：SASL/SCRAM-SHA512（User/Password 均非空时启用）
# # ===========================================================
# kafka:
#   # Kafka Broker 地址列表（单机或集群）
#   host: 192.168.191.100:9094
#   # SASL 认证用户名（空字符串表示不启用认证）
#   user: root
#   # SASL 认证密码
#   password: CEki57pxTJyYaLD
#   tls: false

# ===========================================================
# Redis 缓存/队列配置
# 用于缓存、分布式锁、服务发现（gRPC 地址注册）、
# 定时器任务存储（ZSet）、Snowflake ID 预分配
# 连接地址格式：host:port
# ===========================================================
redis:
  host: 192.168.191.100:6379
  # Redis 认证密码（无密码则留空）
  password: CEki57pxTJyYaLD
  # 连接池最大连接数（可选，0 或不配置使用默认值 200）
  # pool_size: 200
  # 连接池最小空闲连接数（可选，0 或不配置使用默认值 20）
  # min_idle_conns: 20

# # ===========================================================
# # MySQL / TiDB 数据库配置
# # 主业务数据库，通过 GORM + MySQL 驱动连接
# # 注意：host 需包含端口号
# # ===========================================================
# db:
#   host: 192.168.191.100:4000
#   # 数据库登录用户名
#   user: root
#   # 数据库登录密码
#   password: CEki57pxTJyYaLD
#   # 目标数据库名称（需提前创建）
#   database: kgame
#   # 连接池参数（可选，0 或不配置使用默认值）
#   # max_idle_conns: 20       # 最大空闲连接数
#   # max_open_conns: 100      # 最大打开连接数
#   # conn_max_idle_minute: 5  # 空闲连接存活分钟数
#   # conn_max_lifetime_minute: 60  # 连接最大存活分钟数

# # ===========================================================
# # RabbitMQ 消息队列配置
# # 用于消息消费（如订单处理、通知推送等）
# # 多个 Broker 地址用逗号分隔
# # ===========================================================
# rabbitmq:
#   host: 192.168.191.100:5674,192.168.191.100:5675
#   user: root
#   password: CEki57pxTJyYaLD

# # ===========================================================
# # RisingWave 流式数据库配置
# # 兼容 PostgreSQL 协议的流式数据库，用于物化视图和实时数据处理
# # 通过 GORM + PostgreSQL 驱动连接
# # ===========================================================
# risingwave:
#   host: 192.168.191.100:4566
#   user: root
#   password: CEki57pxTJyYaLD
#   database: kgame

# # ===========================================================
# # etcd 分布式键值存储配置
# # 用于分布式配置管理、服务注册与发现、分布式协调
# # ===========================================================
# etcd:
#   host: 192.168.191.100:3379
#   user: root
#   password: CEki57pxTJyYaLD

# # ===========================================================
# # Elasticsearch 搜索引擎配置
# # 用于全文检索、日志分析、数据聚合查询
# # host 需包含协议前缀（http:// 或 https://）
# # ===========================================================
# elastic:
#   host: "http://192.168.191.100:9200"
#   # Elasticsearch 认证用户名（如启用了 X-Pack Security）
#   user: elastic
#   password: CEki57pxTJyYaLD

# # ===========================================================
# # MongoDB 文档数据库配置
# # 用于非结构化数据存储、JSON 文档查询
# # 连接地址格式：host:port（默认 27017）
# # ===========================================================
# mongodb:
#   host: 192.168.191.100:27017
#   user: root
#   password: CEki57pxTJyYaLD

# # ===========================================================
# # MinIO 对象存储配置
# # 兼容 S3 协议的对象存储服务，用于文件存储（图片、文档、日志等）
# # ===========================================================
# minio:
#   host: 192.168.191.100:9000
#   user: root
#   password: CEki57pxTJyYaLD
