# ============================================================
# Shark 全局配置模板
# ============================================================
# 默认读取路径为 ./config/config.yaml。本模板所有配置项均已注释，
# 取消注释的项才会生效；未配置 host 的中间件不会初始化。
#
# 加载规则：
#   1. 优先级：环境变量 > 本文件 > 代码默认值。
#   2. 环境变量名为配置键转大写、"." 换成 "_"，例如 redis_cluster.host -> REDIS_CLUSTER_HOST。
#      env、id、http 等短键同样会读取同名系统环境变量，例如 ENV 会覆盖 env，注意冲突。
#   3. host 列表可写成 YAML 列表，也可写成逗号分隔字符串（环境变量常用此形式）。
#   4. 密码默认按明文读取；仅当使用 NewOptionWithRsaAndConfigFile 传入 RSA 私钥时，
#      才会把 Base64 编码的 PKCS#1 v1.5 密文解密。
#   5. 指定的配置文件不存在或无法解析时，加载直接返回 error。

# ============================================================
# 基础配置
# ============================================================

# 运行环境：dev / test / prod。dev 下会打印 swagger 访问地址。
# env: dev

# 实例编号，参与定时器 key 生成（{project}:timer:{name}-{id}）。多实例部署时需唯一。
# id: "1"

# HTTP 服务端口（Gin）。0 或不配置时不启动 HTTP 服务。
http: 3928

# gRPC 服务端口。0 或不配置时不监听 gRPC 端口，客户端连接不受影响。
# grpc: 3929

# 存活探测端口，提供 /health，仅表示进程在运行，不检查中间件。
# 0 或不配置时不启动。
# health: 3930

# pprof 端口，提供 /debug/pprof/。0 或不配置时不启动，建议仅在内网开放。
# pprof: 3931

# 是否启用定时器（sharktimer，依赖 Redis）。
# timer: true

# 是否将日志异步写入 Kafka，topic 为 {project}_game_log_{env}。
# 需同时配置 kafka；Kafka Writer 创建失败时仅输出到控制台。
# kafkalog: true

# ============================================================
# Kafka 消息队列
# 用于异步消息、事件溯源、日志推送
# ============================================================
# kafka:
#   # Broker 地址，可写列表或逗号分隔字符串
#   host: 192.168.191.100:9094
#   # SASL/SCRAM-SHA-512 认证；user 与 password 均非空时启用
#   user: root
#   password: CEki57pxTJyYaLD
#   # 是否启用 TLS（最低 TLS 1.2）
#   tls: false

# ============================================================
# Redis 缓存 / 分布式锁 / 服务发现 / 定时器 / Snowflake 预分配
# 地址格式 host:port，可写列表
# ============================================================

# 自动探测模式：先按集群连接，服务端不支持集群时回退为单机/主从。
# redis:
#   host: 192.168.191.100:6379
#   # 无密码则留空
#   password: CEki57pxTJyYaLD
#   # 集群节点地址替换（strings.ReplaceAll），用于把节点返回的内网地址映射为可达地址。
#   # 仅集群模式生效，两项需同时非空。
#   # replace_from: 10.0.0.1
#   # replace_to: 192.168.191.100
#   # 每个节点的最大连接数，0 或不配置时默认 200
#   # pool_size: 200
#   # 最小空闲连接数，0 或不配置时默认 20
#   # min_idle_conns: 20

# 显式指定集群模式，结构与 redis 相同。
# 仅在自动探测未建立集群连接时生效。
# redis_cluster:
#   host: 192.168.191.100:6379
#   password: CEki57pxTJyYaLD

# 显式指定单机或主从模式，结构与 redis 相同。
# 仅在自动探测未建立单机连接时生效。
# redis_client:
#   host: 192.168.191.100:6379
#   password: CEki57pxTJyYaLD

# ============================================================
# MySQL / TiDB 主业务数据库（GORM + MySQL 驱动）
# ============================================================
# db:
#   # 地址必须包含端口。列表只取第一个地址。
#   host: 192.168.191.100:4000
#   user: root
#   password: CEki57pxTJyYaLD
#   # 需提前创建
#   database: kgame
#   # 连接池参数，0 或不配置时使用默认值
#   # max_idle_conns: 20              # 默认 20
#   # max_open_conns: 100             # 默认 100
#   # conn_max_idle_minute: 5         # 默认 5
#   # conn_max_lifetime_minute: 60    # 默认 60

# ============================================================
# Elasticsearch 搜索引擎（全文检索、日志分析）
# ============================================================
# elastic:
#   # 地址必须带协议前缀 http:// 或 https://，可写列表
#   host: "http://192.168.191.100:9200"
#   user: elastic
#   password: CEki57pxTJyYaLD

# ============================================================
# ClickHouse 原生协议（默认端口 9000，TLS 常用端口 9440）
# ============================================================
# clickhouse:
#   # 原生协议地址，host:port，可写列表
#   host: 192.168.191.100:19000
#   user: admin
#   password: CEki57pxTJyYaLD
#   database: kgame
#   # 是否启用 TLS（最低 TLS 1.2）
#   tls: false

# ============================================================
# RabbitMQ 消息队列（消息消费，如订单处理、通知推送）
# ============================================================
# rabbitmq:
#   # Broker 地址列表，格式 host:port，可加 amqp:// 或 amqps:// 前缀（缺省 amqp）
#   # 服务名经 CRC16 计算后固定选择其中一个 broker
#   host: 192.168.191.100:5674,192.168.191.100:5675
#   user: root
#   password: CEki57pxTJyYaLD

# ============================================================
# RisingWave 流式数据库（兼容 PostgreSQL 协议，用于物化视图和实时数据处理）
# ============================================================
# risingwave:
#   # 地址格式 host:port。列表只取第一个地址。
#   host: 192.168.191.100:4566
#   user: root
#   password: CEki57pxTJyYaLD
#   database: kgame

# ============================================================
# etcd 分布式键值存储（分布式配置、服务注册与发现）
# ============================================================
# etcd:
#   # 集群端点列表
#   host: 192.168.191.100:3379
#   # user 为空时不启用认证
#   user: root
#   password: CEki57pxTJyYaLD

# ============================================================
# MongoDB 文档数据库
# ============================================================
# mongodb:
#   # 地址格式 host:port（默认 27017）。只取第一个地址。
#   host: 192.168.191.100:27017
#   # 必填：连接 URI 总是携带用户名和密码，认证源为 admin，不支持匿名访问
#   user: root
#   password: CEki57pxTJyYaLD

# ============================================================
# MinIO 对象存储（兼容 S3，用于图片、文档、日志等文件）
# ============================================================
# minio:
#   # 地址格式 host:port。只取第一个地址，固定使用 HTTP。
#   host: 192.168.191.100:9000
#   # user 为 Access Key，password 为 Secret Key
#   user: root
#   password: CEki57pxTJyYaLD
